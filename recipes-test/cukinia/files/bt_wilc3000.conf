# wilc3000 specific bluetooth initialization
echo BT_POWER_UP > /dev/wilc_bt
sleep 1
echo BT_DOWNLOAD_FW > /dev/wilc_bt
sleep 1
# Power up the bt/wifi chip
ip link set dev wlan0 up
sleep 1
btattach -N -B $BT_DEVICE -S 115200 &
BTATTACH_PID=$!
sleep 5

cukinia_conf_include /etc/cukinia.d/bluetooth.conf

kill $BTATTACH_PID
wait $BTATTACH_PID
