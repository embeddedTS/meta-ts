	nxp/imx/imx6q-ts7990-lxd-revb.dtb \
	nxp/imx/imx6q-ts7990-lxd.dtb \
	nxp/imx/imx6q-ts7990-microtips-revb.dtb \
	nxp/imx/imx6q-ts7990-microtips.dtb \
	nxp/imx/imx6q-ts7990-okaya-revb.dtb \
	nxp/imx/imx6q-ts7990-okaya.dtb "

# If ts4900-utils is used, then also install tssilomon-start for this machine
# RDEPENDS like this is not really recommended for use in a machine conf,
# however, none of the MACHINE_EXTRA_R* variables honor a PN appended to them.
# We want tssilomon-start to be included on this machine, but only if the
# relevant utilities package is installed, and only the base RDEPENDS variable
# can accept a PN
RDEPENDS:ts4900-utils += "tssilomon-start"
