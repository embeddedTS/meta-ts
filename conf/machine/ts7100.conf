include conf/machine/include/tsimx6ul.inc

KERNEL_DEVICETREE = "nxp/imx/imx6ul-ts7100-1.dtb nxp/imx/imx6ul-ts7100-3.dtb"

MACHINE_FEATURES += "screen touchscreen"

# If ts7100-utils is used, then also install tssilomon-start for this machine
# RDEPENDS like this is not really recommended for use in a machine conf,
# however, none of the MACHINE_EXTRA_R* variables honor a PN appended to them.
# We want tssilomon-start to be included on this machine, but only if the
# relevant utilities package is installed, and only the base RDEPENDS variable
# can accept a PN
# NOTE: Not enabled at the moment as the tssilomon script for the TS-7100 is
# not complete
#RDEPENDS:ts7100-utils += "tssilomon-start"
